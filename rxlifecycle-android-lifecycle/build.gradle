apply plugin: 'com.android.library'

android {
    namespace 'com.trello.rxlifecycle2.android.lifecycle'
    compileSdkVersion rootProject.ext.compileSdkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
    }
}

repositories {
    mavenCentral()
    google()
}

dependencies {
    implementation project(':rxlifecycle')

    implementation rootProject.ext.rxAndroid
    implementation rootProject.ext.supportAnnotations
    implementation rootProject.ext.lifecycle
    annotationProcessor rootProject.ext.lifecycleProcessor

    testImplementation rootProject.ext.junit
    testImplementation rootProject.ext.robolectric
    testImplementation rootProject.ext.lifecycleExtensions
}



